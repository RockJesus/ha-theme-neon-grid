# ══════════════════════════════════════════════════════════════════
#  Neon Grid · Neon Plasma — Home Assistant 赛博朋克主题合集
#  主题名：Neon Grid（夜城青） / Neon Plasma（等离子紫）
#  结构：暗色（主形态）+ 亮色（白昼 HUD），modes 双模式可切换
#  说明：键名不带 "--"，前端会自动补前缀；hex 值会自动派生同名 rgb-* 变量
#  放置：/config/themes/neon-grid.yaml
#  启用：configuration.yaml → frontend: themes: !include_dir_merge_named themes
#  重载：动作 frontend.reload_themes
#  版本：v1.0.1
# ══════════════════════════════════════════════════════════════════

"Neon Grid":

  # ────────────────────────────────────────────────────────────────
  # 1. 色阶层（模式无关）：05 最深 → 95 最浅
  #    语义令牌在暗色模式取低段做填充、取高段做文字；亮色模式相反
  # ────────────────────────────────────────────────────────────────
  ha-color-primary-05: "#001411"
  ha-color-primary-10: "#002420"
  ha-color-primary-20: "#003B35"
  ha-color-primary-30: "#00594F"
  ha-color-primary-40: "#007A6E"
  ha-color-primary-50: "#00A08F"
  ha-color-primary-60: "#18C9B9"
  ha-color-primary-70: "#2FE3D2"
  ha-color-primary-80: "#7CEDE3"
  ha-color-primary-90: "#B8F8F1"
  ha-color-primary-95: "#DFFDFA"

  # 冷调蓝黑中性阶：代替默认的中性灰，全局底色带一点夜色蓝
  ha-color-neutral-05: "#05060A"
  ha-color-neutral-10: "#0B0D14"
  ha-color-neutral-20: "#12141D"
  ha-color-neutral-30: "#1A1D28"
  ha-color-neutral-40: "#262A38"
  ha-color-neutral-50: "#3D4356"
  ha-color-neutral-60: "#626B80"
  ha-color-neutral-70: "#8C94A8"
  ha-color-neutral-80: "#B7BFCF"
  ha-color-neutral-90: "#DCE1EB"
  ha-color-neutral-95: "#F4F6FB"

  # ────────────────────────────────────────────────────────────────
  # 2. 形状 / 排版 / 动效（模式无关）
  #    赛博朋克＝硬边几何：默认 4/8/12 的圆角整体收紧，形成切面感
  # ────────────────────────────────────────────────────────────────
  ha-border-width-sm: "1px"
  ha-border-width-md: "1px"
  ha-border-width-lg: "2px"
  ha-border-radius-sm: "3px"
  ha-border-radius-md: "5px"
  ha-border-radius-lg: "7px"
  ha-border-radius-xl: "9px"
  ha-border-radius-2xl: "11px"
  ha-border-radius-3xl: "13px"
  ha-border-radius-4xl: "15px"
  ha-border-radius-5xl: "17px"
  ha-border-radius-6xl: "19px"
  ha-picture-border-radius: "7px"
  ha-picture-border-radius-sm: "3px"

  ha-font-family-body: 'Inter, "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif'
  ha-font-family-heading: 'Inter, "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", system-ui, -apple-system, sans-serif'
  ha-font-family-code: '"JetBrains Mono", "SF Mono", "Cascadia Mono", ui-monospace, monospace'
  ha-font-family-longform: 'Inter, "Noto Sans SC", system-ui, sans-serif'
  ha-font-size-scale: "1"
  ha-font-weight-heading: "600"
  ha-font-weight-action: "500"
  ha-line-height-normal: "1.55"

  ha-animation-duration-instant: "90ms"
  ha-animation-duration-fast: "160ms"
  ha-animation-duration-normal: "240ms"
  ha-animation-duration-slow: "320ms"

  ha-color-focus: "#2FE3D2"

  # ────────────────────────────────────────────────────────────────
  # 3. 暗色模式（主形态）
  # ────────────────────────────────────────────────────────────────
  modes:
    dark:

      # ── 3.1 主色与语义文本 ────────────────────────────────────
      primary-color: "#2FE3D2"
      dark-primary-color: "#00A08F"
      darker-primary-color: "#007A6E"
      light-primary-color: "#7CEDE3"
      accent-color: "#FF4D9D"

      text-primary-color: "#04120F"          # 亮青按钮上的字（近黑）
      text-light-primary-color: "#04120F"
      text-accent-color: "#1A0010"

      primary-text-color: "#E6EAF2"
      secondary-text-color: "#98A0B4"
      disabled-text-color: "#5A6377"
      disabled-color: "#2A3040"

      # ── 3.2 表面三层：页底 / 卡片 / 悬浮 ─────────────────────
      primary-background-color: "#06070C"
      card-background-color: "#0E1018"
      secondary-background-color: "#161923"
      clear-background-color: "#06070C"

      ha-color-text-primary: "#E6EAF2"
      ha-color-text-secondary: "#98A0B4"
      ha-color-text-disabled: "#5A6377"
      ha-color-text-link: "#2FE3D2"
      ha-color-text-primary-inverted: "#04120F"

      ha-color-surface-default: "#0E1018"
      ha-color-surface-low: "#06070C"
      ha-color-surface-lower: "#040509"
      ha-color-surface-default-inverted: "#F4F6FB"
      ha-color-on-surface-default: "#E6EAF2"

      ha-color-form-background: "#181B26"
      ha-color-form-background-hover: "#1F2432"
      ha-color-form-background-disabled: "#12141D"

      # ── 3.3 线与影 ───────────────────────────────────────────
      divider-color: "rgba(230, 234, 242, 0.08)"
      outline-color: "rgba(47, 227, 210, 0.20)"
      outline-hover-color: "rgba(47, 227, 210, 0.38)"
      shadow-color: "rgba(0, 0, 0, 0.66)"
      scrollbar-thumb-color: "#2A3040"

      ha-box-shadow-s: "0 1px 2px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(47, 227, 210, 0.05)"
      ha-box-shadow-m: "0 8px 24px rgba(0, 0, 0, 0.55), 0 0 32px rgba(47, 227, 210, 0.07)"
      ha-box-shadow-l: "0 18px 48px rgba(0, 0, 0, 0.60), 0 0 56px rgba(47, 227, 210, 0.09)"

      bar-box-shadow: "0 2px 12px rgba(0, 0, 0, 0.66)"

      # ── 3.4 导航与页头 ───────────────────────────────────────
      sidebar-background-color: "#04050A"
      sidebar-text-color: "#E6EAF2"
      sidebar-selected-text-color: "#2FE3D2"
      sidebar-selected-icon-color: "#2FE3D2"
      sidebar-icon-color: "rgba(230, 234, 242, 0.55)"
      app-header-background-color: "#06070C"
      app-header-text-color: "#E6EAF2"
      app-header-border-bottom: "1px solid rgba(47, 227, 210, 0.14)"
