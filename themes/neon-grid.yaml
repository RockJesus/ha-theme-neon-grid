      # ── 3.5 卡片 ─────────────────────────────────────────────
      ha-card-background: "#0E1018"
      ha-card-border-width: "1px"
      ha-card-border-radius: "10px"
      ha-card-box-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 32px rgba(0, 0, 0, 0.55)"
      ha-card-header-color: "#E6EAF2"
      ha-card-header-font-size: "20px"

      # ── 3.6 控件 ─────────────────────────────────────────────
